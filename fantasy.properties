# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA LOTERÍA
# ==============================================================================
loteria.nombre=Chispazo
loteria.totalNumeros=28
loteria.numerosPorSorteo=5
estado.nombre=Lotería Nacional (México)

# Idioma del sitio: "es" o "en". strings.properties se busca SIEMPRE en la
# misma carpeta que este fantasy.properties (ej. C:\Loterias\chispazo\español\
# o C:\Loterias\chispazo\ingles\), así que no hace falta indicar su ruta aparte.
idioma=es

# Monetag: aún sin cuenta/zonas propias para resultadoschispazohoy.com -> apagado.
monetag.inpagepush.enabled=false
monetag.inpagepush.zone=
monetag.inpagepush.maxPorDia=2

monetag.vignette.enabled=false
monetag.vignette.zone=
monetag.vignette.maxPorDia=1

# Contador de visitas (CountAPI, gratis, sin registro): namespace propio para
# no mezclar el conteo con el de fantasy5florida.
contador.enabled=true
contador.prefijo=chispazohoy

# Microsoft Clarity: aún sin proyecto propio para este sitio -> apagado.
clarity.enabled=false
clarity.projectId=

# Enlace a sitio hermano: no aplica a Chispazo por ahora.
enlaceHermano.enabled=true
enlaceHermano.texto=Florida
enlaceHermano.url=http://fantasy5florida.online

# Base de Datos
loteria.tablaResultados=CHISPA28

# Archivo de Salida
loteria.htmlSalida=C:/Loterias/chispazo/español/index.html
grafica.htmlSalida=C:/Loterias/chispazo/español/grafica.html
historial.jsonSalida=C:/Loterias/chispazo/español/historial.json
historial.csvSalida=C:/Loterias/chispazo/español/historial.csv
tablas.unosJsonSalida=C:/Loterias/chispazo/español/unos.json
tablas.paresJsonSalida=C:/Loterias/chispazo/español/pares.json
tablas.terciasJsonSalida=C:/Loterias/chispazo/español/tercias.json
tablas.versionJsonSalida=C:/Loterias/chispazo/español/version.json

# ==============================================================================
# TARJETA DE ÚLTIMOS RESULTADOS
# ==============================================================================
# Sorteo 1
loteria.sorteo1.codigoH=N
loteria.sorteo1.nombre=Clasico

# Sorteo 2
loteria.sorteo2.codigoH=T
loteria.sorteo2.nombre=De las tres

# ==============================================================================
# UMBRALES DE FILTROS ESTADÍSTICOS
# ==============================================================================
# OJO: estos umbrales (totalPares=35, totalTercias=25) se copiaron de Fantasy 5
# (36 números). Chispazo tiene solo 28 -> menos combinaciones posibles, así que
# probablemente convenga bajarlos una vez que veas los datos reales generados
# (si casi no aparecen filas en las tablas, baja estos números).
filtro.distUnos=0
filtro.totalPares=35
filtro.distPares=0
filtro.totalTercias=25
filtro.distTercias=0

# ==============================================================================
# ANUNCIOS ADSTERRA
# ==============================================================================
# Todos apagados por ahora: son zonas registradas para fantasy5florida.online,
# no sirven para resultadoschispazohoy.com. Cuando crees tus propias zonas de
# Adsterra para este dominio, pon aquí sus códigos y cambia enabled=true.

# 1) Social bar (junto al bloque de "Últimos Resultados")
ads.socialbar.enabled=false
ads.socialbar.url=

# 2) Native banner junto a "Últimos Resultados"
ads.native.resultados.enabled=false
ads.native.resultados.url=

# 3) Banner (iframe) en el aside izquierdo
ads.banner.enabled=false
ads.banner.key=
ads.banner.width=300
ads.banner.height=250
ads.banner.domain=www.highperformanceformat.com

# 3b) Segundo banner independiente, para el aside derecho en pantallas anchas (desktop)
ads.banner.derecha.enabled=false
ads.banner.derecha.key=
ads.banner.derecha.width=320
ads.banner.derecha.height=50
ads.banner.derecha.domain=www.highperformanceformat.com

# 4) Native banner en el aside izquierdo (debajo del banner anterior)
ads.native.aside.enabled=false
ads.native.aside.url=

# ==============================================================================
# GIT / PUBLICACIÓN (GitHub Pages)
# ==============================================================================
git.enabled=true
git.repoLocalPath=C:/repos/chispazohoy
git.carpetaOrigen=C:/Loterias/chispazo/español
git.rama=main
git.mensajeCommit=Actualización automática de estadísticas Chispazo

